[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seoulpath-guard"
version = "0.1.0"
description = "Composite MCP server for Seoul tourism itinerary QA & dynamic rebalancing"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.2.0",
  "httpx>=0.27",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
